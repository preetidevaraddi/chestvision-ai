<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Dashboard — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="stat-grid" id="stat-grid">
    <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value skeleton" style="height:30px; width:50px;"></div></div>
    <div class="stat-card"><div class="stat-label">Priority Cases</div><div class="stat-value skeleton" style="height:30px; width:50px;"></div></div>
  </div>

  <div class="flex-between mb-16">
    <h2 class="section-title">Recent Reports</h2>
    <select id="status-filter" style="padding:4px 8px; border-radius:4px; border:1px solid var(--border-light);">
      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="review">Marked for Review</option>
      <option value="viewed">Viewed</option>
    </select>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Patient ID</th>
            <th>Predicted Condition</th>
            <th>Confidence</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Generated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="8"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js?v=3"></script>
<script>
  Auth.requireRole("doctor");
  renderShell({ role: "doctor", pageTitle: "Dashboard"});

  let allReports = [];
  
  function renderReports(reports) {
      const tbody = document.getElementById("tbody");
      if (!reports.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">No reports available yet.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = reports
        .map(
          (r) => {
            let statusBadge = "";
            if (r.status === "pending") {
                statusBadge = `<span class="badge" style="background:#fff3cd; color:#856404; border-color:#ffeeba">Pending</span>`;
            } else if (r.status === "review") {
                statusBadge = `<span class="badge badge-review"><span class="badge-dot"></span>Marked for Review</span>`;
            } else {
                statusBadge = `<span class="badge badge-normal">Viewed</span>`;
            }
            return `<tr>
            <td>${escapeHtml(r.patient_name)}</td>
            <td class="mono">${r.patient_display_id || r.patient_id}</td>
            <td>${escapeHtml(r.predicted_condition)}</td>
            <td>${Math.round(r.confidence * 100)}%</td>
            <td>${statusBadgeHtml(r.priority)}</td>
            <td>${statusBadge}</td>
            <td class="text-muted">${formatDate(r.generated_at)}</td>
            <td><a href="report-detail.html?report_id=${r.report_id}" class="btn btn-outline btn-sm">View Report</a></td>
          </tr>`
          }
        )
        .join("");
  }

  (async () => {
    try {
      const data = await Api.doctorDashboard();
      document.getElementById("stat-grid").innerHTML = `
        <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value">${data.total_reports}</div></div>
        <div class="stat-card"><div class="stat-label">Priority Cases</div><div class="stat-value">${data.priority_cases}</div></div>
      `;
      allReports = data.recent_reports;
      renderReports(allReports);
    } catch (err) {
      apiErrorToast(err, "Could not load dashboard.");
    }
  })();
  
  document.getElementById("status-filter").addEventListener("change", (e) => {
      const filter = e.target.value;
      if (filter === "all") {
          renderReports(allReports);
      } else {
          renderReports(allReports.filter(r => r.status === filter));
      }
  });
</script>
</body>
</html>
