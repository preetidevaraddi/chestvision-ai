<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Dashboard — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="stat-grid" id="stat-grid">
    <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value skeleton" style="height:30px; width:50px;"></div></div>
    <div class="stat-card"><div class="stat-label">Priority Cases</div><div class="stat-value skeleton" style="height:30px; width:50px;"></div></div>
  </div>

  <h2 class="section-title">Recent Reports</h2>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Report ID</th><th>Generated</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="3"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("doctor");
  renderShell({ role: "doctor", pageTitle: "Dashboard", pageSub: "Read-only overview of patient reports" });

  (async () => {
    try {
      const data = await Api.doctorDashboard();
      document.getElementById("stat-grid").innerHTML = `
        <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value">${data.total_reports}</div></div>
        <div class="stat-card"><div class="stat-label">Priority Cases</div><div class="stat-value">${data.priority_cases}</div></div>
      `;
      const tbody = document.getElementById("tbody");
      if (!data.recent_reports.length) {
        tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state">No reports available yet.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = data.recent_reports
        .map(
          (r) => `<tr>
            <td class="mono">${r.report_id.slice(0, 8)}</td>
            <td class="text-muted">${formatDate(r.generated_at)}</td>
            <td><a href="report-detail.html?report_id=${r.report_id}" class="btn btn-outline btn-sm">View</a></td>
          </tr>`
        )
        .join("");
    } catch (err) {
      apiErrorToast(err, "Could not load dashboard.");
    }
  })();
</script>
</body>
</html>
