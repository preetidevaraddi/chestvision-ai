<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Detail — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div id="content-wrap"><div class="skeleton" style="height:200px;"></div></div>
</div>

<script src="../js/api.js?v=2"></script>
<script src="../js/ui.js?v=3"></script>
<script>
  Auth.requireRole("doctor");
  renderShell({ role: "doctor", pageTitle: "AI Analysis Result", pageSub: "Read-only" });

  const params = new URLSearchParams(window.location.search);
  const reportId = params.get("report_id");
  const wrap = document.getElementById("content-wrap");

  async function load() {
    try {
      const r = await Api.doctorGetReport(reportId);
      const a = r.analysis;
      const p = r.patient;
      const isOod = a.top_prediction_label === "Unknown / Outside Training Classes";

      wrap.innerHTML = `
        ${a.is_demo_model ? `<div class="alert alert-demo"><strong>DEMO MODE:</strong> ${escapeHtml(a.disclaimer)}</div>` : `<div class="alert alert-info">${escapeHtml(a.disclaimer)}</div>`}

        <div class="flex-between mb-16" style="align-items: center;">
            <div id="status-container" style="margin-top: 4px;"></div>
          </div>
          <div>
            <button id="btn-review" class="btn btn-outline btn-sm" style="margin-right:8px;"></button>
            <a href="${fileUrl(r.report_path)}" target="_blank" class="btn btn-primary btn-sm">Download PDF</a>
          </div>
        </div>

        <div class="card mb-16">
          <h3 class="mb-16">Patient Information</h3>
          <div class="form-row">
            <div><label>Name</label><div>${escapeHtml(p.name)}</div></div>
            <div><label>Patient ID</label><div class="mono">${p.patient_display_id || p.patient_id}</div></div>
          </div>
          <div class="form-row mt-16">
            <div><label>Age</label><div>${p.age}</div></div>
            <div><label>Gender</label><div style="text-transform:capitalize;">${p.gender}</div></div>
          </div>
        </div>
        
        ${isOod ? `
        <div class="alert mb-16" style="background:#fff3cd; color:#856404; border:1px solid #ffeeba;">
          <strong>⚠ Warning:</strong> This model was trained only on Normal, Pneumonia, COVID-19, and Tuberculosis. The uploaded X-ray may contain a condition outside these training classes, so a specific disease prediction cannot be provided reliably.
        </div>` : ""}

        <div class="flex" style="gap:16px; flex-wrap:wrap;">
          <div class="card" style="flex:1; min-width:300px;">
            <h3 class="mb-16">AI Analysis</h3>
            <div class="flex-gap mb-16">
              ${uncertaintyBadgeHtml(a.uncertainty_status)}
              ${statusBadgeHtml(a.priority)}
            </div>
            <div id="gauge-list"></div>
          </div>
          <div class="card" style="flex:1; min-width:280px;">
            <h3 class="mb-16">Visual Explanation</h3>
            <div class="flex" style="gap:10px;">
              <div style="flex:1;">
                <div class="preview-frame"><img src="${fileUrl(r.xray_image_path)}" alt="Original X-ray"></div>
                <div class="text-muted mt-8" style="font-size:11.5px; text-align:center;">Original</div>
              </div>
              ${
                a.heatmap_path
                  ? `<div style="flex:1;">
                       <div class="preview-frame"><img src="${fileUrl(a.heatmap_path)}" alt="Heatmap"></div>
                       <div class="text-muted mt-8" style="font-size:11.5px; text-align:center;">${isOod ? 'Model Attention Visualization — Not a Diagnostic Finding' : 'AI-highlighted regions'}</div>
                     </div>`
                  : `<div style="flex:1;">
                       <div class="preview-frame"><img src="${fileUrl(r.xray_image_path)}" alt="Original X-ray"></div>
                       <div class="text-muted mt-8" style="font-size:11.5px; text-align:center;">No abnormal region detected</div>
                     </div>`
              }
            </div>
          </div>
        </div>


        <div class="card mt-16">
          <h3 class="mb-8">Priority / Urgency</h3>
          <p class="text-muted" style="font-size:13.5px;">
            ${statusBadgeHtml(a.priority)} &nbsp; AI-assisted prioritization — not a diagnosis.
          </p>
        </div>

      `;

      document.getElementById("gauge-list").innerHTML = gaugeListHtml(a.predicted_conditions, 14);

      // Handle status logic
      let currentStatus = r.status;
      const statusContainer = document.getElementById("status-container");
      const btnReview = document.getElementById("btn-review");

      function updateStatusUI() {
          if (currentStatus === "pending") {
              statusContainer.innerHTML = `<span class="badge" style="background:#fff3cd; color:#856404; border-color:#ffeeba">Pending</span>`;
          } else if (currentStatus === "review") {
              statusContainer.innerHTML = `<span class="badge badge-review"><span class="badge-dot"></span>Marked for Review</span>`;
              btnReview.textContent = "Remove from Review";
          } else {
              statusContainer.innerHTML = `<span class="badge badge-normal">Viewed</span>`;
              btnReview.textContent = "Mark for Review";
          }
      }
      
      updateStatusUI();

      if (currentStatus === "pending") {
          // Auto update to viewed since report was successfully opened
          try {
              await Api.doctorUpdateReportStatus(reportId, { status: "viewed" });
              currentStatus = "viewed";
              updateStatusUI();
          } catch (e) {
              console.error("Failed to update status to viewed", e);
          }
      }

      btnReview.addEventListener("click", async () => {
          const newStatus = currentStatus === "review" ? "viewed" : "review";
          btnReview.disabled = true;
          try {
              await Api.doctorUpdateReportStatus(reportId, { status: newStatus });
              currentStatus = newStatus;
              updateStatusUI();
              showToast(newStatus === "review" ? "Report marked for review" : "Report removed from review", "success");
          } catch (err) {
              apiErrorToast(err, "Could not update status.");
          } finally {
              btnReview.disabled = false;
          }
      });
      
    } catch (err) {
      apiErrorToast(err, "Could not load report.");
    }
  }

  load();
</script>
</body>
</html>
