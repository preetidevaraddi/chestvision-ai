<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Reports — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="flex-between mb-16">
    <input type="search" id="search-input" placeholder="Search by patient name, ID, or report ID…" style="max-width:320px; flex:1; margin-right:16px;">
    <select id="status-filter" style="padding:8px; border-radius:4px; border:1px solid var(--border-light);">
      <option value="all">All Statuses</option>
      <option value="pending">Pending</option>
      <option value="review">Marked for Review</option>
      <option value="viewed">Viewed</option>
    </select>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Report ID</th>
            <th>Patient Name</th>
            <th>Patient ID</th>
            <th>Predicted Condition</th>
            <th>Confidence</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Generated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="9"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("doctor");
  renderShell({ role: "doctor", pageTitle: "Patient Reports", pageSub: "View-only access to AI analysis reports" });

  let allReports = [];
  const tbody = document.getElementById("tbody");

  function render(reports) {
    if (!reports.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">No reports found.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = reports
      .map(
        (r) => {
            let statusBadge = "";
            if (r.status === "pending") {
                statusBadge = `<span class="badge" style="background:#fff3cd; color:#856404; border-color:#ffeeba">Pending</span>`;
            } else if (r.status === "review") {
                statusBadge = `<span class="badge badge-review"><span class="badge-dot"></span>Marked for Review</span>`;
            } else {
                statusBadge = `<span class="badge badge-normal">Viewed</span>`;
            }
            return `<tr>
          <td class="mono">${r.report_id.slice(0, 8)}</td>
          <td>${escapeHtml(r.patient_name)}</td>
          <td class="mono">${r.patient_id}</td>
          <td>${escapeHtml(r.predicted_condition)}</td>
          <td>${Math.round(r.confidence * 100)}%</td>
          <td>${statusBadgeHtml(r.priority)}</td>
          <td>${statusBadge}</td>
          <td class="text-muted">${formatDate(r.generated_at)}</td>
          <td><a href="report-detail.html?report_id=${r.report_id}" class="btn btn-outline btn-sm">View Report</a></td>
        </tr>`
        }
      )
      .join("");
  }

  (async () => {
    try {
      allReports = await Api.doctorListReports();
      render(allReports);
    } catch (err) {
      apiErrorToast(err, "Could not load reports.");
      tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state">Failed to load.</div></td></tr>`;
    }
  })();

  function applyFilters() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const statusFilt = document.getElementById("status-filter").value;
      
      let filtered = allReports;
      if (q) {
          filtered = filtered.filter(r => 
            r.report_id.toLowerCase().includes(q) || 
            r.patient_name.toLowerCase().includes(q) || 
            r.patient_id.toLowerCase().includes(q)
          );
      }
      if (statusFilt !== "all") {
          filtered = filtered.filter(r => r.status === statusFilt);
      }
      render(filtered);
  }

  document.getElementById("search-input").addEventListener("input", applyFilters);
  document.getElementById("status-filter").addEventListener("change", applyFilters);
</script>
</body>
</html>
