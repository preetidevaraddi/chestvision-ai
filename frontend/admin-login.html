<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Login — ChestVision AI</title>
<meta name="description" content="Log in to the ChestVision AI Admin Console to manage patients and X-ray analyses.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">ChestVision AI</div>
    <div class="auth-sub">Log in to the Admin Console</div>

    <div class="auth-role-tabs">
      <a href="admin-login.html" class="active">Admin</a>
      <a href="doctor-login.html">Doctor</a>
    </div>

    <form id="login-form" class="form-grid" novalidate>
      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required>
        <div class="field-error" id="email-error"></div>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <div class="field-error" id="password-error"></div>
      </div>
      <div class="field-error" id="form-error" style="margin-top:-4px;"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log In</button>
    </form>

    <div class="auth-switch">No account yet? <a href="admin-register.html">Register as Admin</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.style.display = msg ? "block" : "none";
  }
  function clearAll() {
    ["email-error", "password-error", "form-error"].forEach((id) => showFieldError(id, ""));
  }

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const form = document.getElementById("login-form");
  const submitBtn = document.getElementById("submit-btn");

  // Clear inline errors when user edits a field
  emailInput.addEventListener("input", () => showFieldError("email-error", ""));
  passwordInput.addEventListener("input", () => {
    showFieldError("password-error", "");
    showFieldError("form-error", "");
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAll();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Frontend email-format validation — never send if malformed
    if (!email) {
      showFieldError("email-error", "Email address is required.");
      return;
    }
    if (!EMAIL_RE.test(email)) {
      showFieldError("email-error", "Please enter a valid email address (e.g. user@example.com).");
      return;
    }
    if (!password) {
      showFieldError("password-error", "Password is required.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner"></span> Logging in…`;
    try {
      const resp = await Api.loginAdmin({ email, password });
      Auth.setSession(resp.access_token, resp.role, resp.name);
      window.location.href = "admin/dashboard.html";
    } catch (err) {
      console.error("Login error:", err);

      alert("Invalid email or password.");

      submitBtn.disabled = false;
      submitBtn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
