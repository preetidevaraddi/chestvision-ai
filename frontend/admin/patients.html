<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="flex-between mb-16">
    <input type="search" id="search-input" placeholder="Search patients by name…" style="max-width:320px;">
    <a href="add-patient.html" class="btn btn-primary">+ Add Patient</a>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Contact</th><th>Registered</th><th></th></tr></thead>
        <tbody id="patients-tbody">
          <tr><td colspan="7"><div class="skeleton" style="height:18px;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js?v=1.1"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("admin");
  renderShell({ role: "admin", pageTitle: "Patients", pageSub: "View and manage patient records" });

  const tbody = document.getElementById("patients-tbody");
  const searchInput = document.getElementById("search-input");

  function formatDateOnly(isoString) {
    if (!isoString) return "Date unavailable";
    const datePart = isoString.split('T')[0].split(' ')[0];
    const d = new Date(datePart);
    if (isNaN(d.getTime())) return "Date unavailable";
    try {
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    } catch (e) {
      return "Date unavailable";
    }
  }

  async function loadPatients(search = "") {
    tbody.innerHTML = `<tr><td colspan="7"><div class="skeleton" style="height:18px;"></div></td></tr>`;
    try {
      const patients = await Api.listPatients(search);
      if (!patients.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No patients found.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = patients
        .map(
          (p) => `<tr>
            <td class="mono">${p.patient_id.slice(0, 8)}</td>
            <td>${escapeHtml(p.name)}</td>
            <td>${p.age}</td>
            <td style="text-transform:capitalize;">${p.gender}</td>
            <td class="text-muted">${escapeHtml(p.contact_number || "—")}</td>
            <td class="text-muted">${formatDateOnly(p.created_at)}</td>
            <td>
              <a href="patient-detail.html?id=${p.patient_id}" class="btn btn-outline btn-sm">View</a>
              <button onclick="confirmDeletePatient('${p.patient_id}')" class="btn btn-outline btn-sm text-danger" style="margin-left: 8px; border-color: var(--status-urgent); color: var(--status-urgent); display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px;" title="Delete patient" aria-label="Delete patient">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </td>
          </tr>`
        )
        .join("");
    } catch (err) {
      apiErrorToast(err, "Could not load patients.");
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Failed to load patients.</div></td></tr>`;
    }
  }

  async function confirmDeletePatient(id) {
    if (!confirm("Are you sure you want to delete this patient? This will permanently remove all their X-rays, analyses, and reports.")) {
      return;
    }
    try {
      await Api.deletePatient(id);
      showToast("Patient deleted successfully.", "success");
      loadPatients(searchInput.value.trim());
    } catch (err) {
      apiErrorToast(err, "Failed to delete patient.");
    }
  }

  let debounceTimer;
  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadPatients(searchInput.value.trim()), 300);
  });

  loadPatients();
</script>
</body>
</html>
