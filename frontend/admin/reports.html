<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Report ID</th><th>Generated</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="3"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("admin");
  renderShell({ role: "admin", pageTitle: "Reports", pageSub: "All generated AI analysis reports" });

  (async () => {
    const tbody = document.getElementById("tbody");
    try {
      const reports = await Api.listReports();
      if (!reports.length) {
        tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state">No reports generated yet.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = reports
        .map(
          (r) => `<tr>
            <td class="mono">${r.report_id.slice(0, 8)}</td>
            <td class="text-muted">${formatDate(r.generated_at)}</td>
            <td><a href="report-view.html?report_id=${r.report_id}" class="btn btn-outline btn-sm">View</a></td>
          </tr>`
        )
        .join("");
    } catch (err) {
      apiErrorToast(err, "Could not load reports.");
      tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state">Failed to load.</div></td></tr>`;
    }
  })();
</script>
</body>
</html>
