<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis History — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="flex-between mb-16">
    <input type="search" id="search-input" placeholder="Search by name or patient ID…" style="max-width:320px;">
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient ID</th><th>Patient Name</th><th>Prediction</th><th>Confidence</th><th>Uncertainty</th><th>Priority</th><th>Model</th><th>Analyzed</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="10"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("admin");
  renderShell({ role: "admin", pageTitle: "Analysis History"});

  let allHistory = [];
  const tbody = document.getElementById("tbody");
  const searchInput = document.getElementById("search-input");

  function renderTable(history) {
    if (!history.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">No analyses found.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = history
      .map(
        (a) => `<tr>
          <td class="mono">${a.patient_display_id || a.patient_id || ''}</td>
          <td>${escapeHtml(a.patient_name || "Unknown")}</td>
          
          <td>${escapeHtml(a.top_prediction_label)}</td>
          <td class="mono">${Math.round(a.top_prediction_confidence * 100)}%</td>
          <td>${uncertaintyBadgeHtml(a.uncertainty_status)}</td>
          <td>${statusBadgeHtml(a.priority)}</td>
          <td>${demoBadgeHtml(a.is_demo_model) || '<span class="text-muted" style="font-size:12px;">trained</span>'}</td>
          <td class="text-muted">${formatDate(a.analyzed_at)}</td>
          <td><a href="analysis-result.html?result_id=${a.result_id}" class="btn btn-outline btn-sm">View</a></td>
        </tr>`
      )
      .join("");
  }

  searchInput.addEventListener("input", () => {
    const term = searchInput.value.toLowerCase();
    const filtered = allHistory.filter(a => 
      (a.patient_name || "").toLowerCase().includes(term) ||
      (a.patient_display_id || "").includes(term)
    );
    renderTable(filtered);
  });

  (async () => {
    try {
      allHistory = await Api.analysisHistory();
      renderTable(allHistory);
    } catch (err) {
      apiErrorToast(err, "Could not load analysis history.");
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">Failed to load.</div></td></tr>`;
    }
  })();
</script>
</body>
</html>
