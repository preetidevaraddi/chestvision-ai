<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis History — ChestVision AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app-shell-root">
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Result ID</th><th>Prediction</th><th>Confidence</th><th>Uncertainty</th><th>Priority</th><th>Model</th><th>Analyzed</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="8"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  Auth.requireRole("admin");
  renderShell({ role: "admin", pageTitle: "Analysis History", pageSub: "All AI analyses run on this system" });

  (async () => {
    const tbody = document.getElementById("tbody");
    try {
      const history = await Api.analysisHistory();
      if (!history.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">No analyses yet.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = history
        .map(
          (a) => `<tr>
            <td class="mono">${a.result_id.slice(0, 8)}</td>
            <td>${escapeHtml(a.top_prediction_label)}</td>
            <td class="mono">${Math.round(a.top_prediction_confidence * 100)}%</td>
            <td>${uncertaintyBadgeHtml(a.uncertainty_status)}</td>
            <td>${statusBadgeHtml(a.priority)}</td>
            <td>${demoBadgeHtml(a.is_demo_model) || '<span class="text-muted" style="font-size:12px;">trained</span>'}</td>
            <td class="text-muted">${formatDate(a.analyzed_at)}</td>
            <td><a href="analysis-result.html?result_id=${a.result_id}" class="btn btn-outline btn-sm">View</a></td>
          </tr>`
        )
        .join("");
    } catch (err) {
      apiErrorToast(err, "Could not load analysis history.");
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">Failed to load.</div></td></tr>`;
    }
  })();
</script>
</body>
</html>
